version: "2"
sql:
  - name: "db"
    queries: "./postgresql/query/"
    schema: "./postgresql/migration/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_json_tags: true
