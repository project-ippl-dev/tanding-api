name: "build and deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [ '1.23' ]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_CREDENTIAL }}
      - name: Setup Gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Docker Auth
        run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev
      - name: Get Git SHA
        run: |
          SEMVER=v0.1.0
          GIT_COMMIT_HASH_SHORT=$(git rev-parse --short HEAD)
          GIT_COMMIT_DATETIME=$(git show -s --date=format:'%Y%m%d%H%M%S' --format=%cd $GIT_COMMIT_HASH_SHORT)
          TAG="$SEMVER-$GIT_COMMIT_DATETIME-$GIT_COMMIT_HASH_SHORT"
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Build Docker Image
        run: docker build -t asia-southeast2-docker.pkg.dev/${{ vars.PROJECT_ID }}/tanding-registry/tanding-api:${{ env.TAG }} .
      - name: Push Docker Image
        run: docker push asia-southeast2-docker.pkg.dev/${{ vars.PROJECT_ID }}/tanding-registry/tanding-api:${{ env.TAG }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tanding-api \
            --image=asia-southeast2-docker.pkg.dev/${{ vars.PROJECT_ID }}/tanding-registry/tanding-api:${{ env.TAG }} \
            --region=asia-southeast2 \
            --platform=managed \
            --service-account=deployment-be@acoustic-portal-407710.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --set-env-vars="HOST=localhost,FE_BASE_URL=http://localhost:3000,STORAGE_BUCKET_ID=tanding-storage,REDIS_HOST=localhost,REDIS_PORT=6379" \
            --set-secrets DATABASE_USERNAME=DATABASE_USERNAME:latest,DATABASE_PASSWORD=DATABASE_PASSWORD:latest,DATABASE_NAME=DATABASE_NAME:latest,DATABASE_HOST=DATABASE_HOST:latest,DATABASE_PORT=DATABASE_PORT:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USERNAME=SMTP_USERNAME:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest,SMTP_SENDER=SMTP_SENDER:latest\

      - name: Summary Report
        run: |
          echo '## Deployment Summary' >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Tag: ${{ env.TAG }}" >> $GITHUB_STEP_SUMMARY