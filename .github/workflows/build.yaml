name: "build"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [ '1.16' ]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.DOCKER_HUBNAME }}/${{ env.DOCKER_REPOSITORY }}
      - name: Get Git SHA
        run: |
          SEMVER=v0.1.0
          GIT_COMMIT_HASH_SHORT=$(git rev-parse --short HEAD)
          GIT_COMMIT_DATETIME=$(git show -s --date=format:'%Y%m%d%H%M%S' --format=%cd $GIT_COMMIT_HASH_SHORT)
          TAG="$SEMVER-$GIT_COMMIT_DATETIME-$GIT_COMMIT_HASH_SHORT"
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: $TAG
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ env.DOCKER_HUBNAME }}/${{ env.DOCKER_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true