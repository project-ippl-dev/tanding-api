name: "Run test on PR"

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened

jobs:
  linter:
    runs-on: ubuntu-24.04
    if: always()
    strategy:
      matrix:
        go-version: [ '1.23' ]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
  tests:
    runs-on: ubuntu-24.04
    if: always()
    strategy:
      matrix:
        go-version: ['1.23']
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run test
        run: |
          go test ./...
